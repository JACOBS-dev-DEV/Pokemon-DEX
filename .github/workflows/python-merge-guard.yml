name: Python merge guard

on:
  pull_request:
    branches:
      - Dev
  workflow_dispatch:

jobs:
  team-manager-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check changed app modules
        run: >-
          python -m py_compile
          src/pokemon_dex/team.py
          src/pokemon_dex/team_gui.py
          src/pokemon_dex/team_items.py
          src/pokemon_dex/launcher.py

      - name: Run Team Manager regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_team_manager.py" -v
